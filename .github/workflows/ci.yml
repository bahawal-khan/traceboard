name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SKIP_ENV_VALIDATION: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      # Production dependencies only; dev-tool advisories are tracked separately.
      - run: npm audit --omit=dev --audit-level=high

  # Integration: IDOR + RLS + repo tests against a real Postgres (ci/docker-compose.db.yml). No secrets are used;
  # every credential below is generated for this run, in an ephemeral container.
  db-tests:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGDATABASE: main
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Start Postgres and the Neon HTTP proxy
        run: |
          echo "127.0.0.1 db.localtest.me" | sudo tee -a /etc/hosts
          docker compose -f ci/docker-compose.db.yml up -d --wait

      - name: Generate run-only credentials
        run: |
          APP_PW=$(openssl rand -hex 24)
          MIG_PW=$(openssl rand -hex 24)
          JOB_PW=$(openssl rand -hex 24)
          echo "::add-mask::$APP_PW"
          echo "::add-mask::$MIG_PW"
          echo "::add-mask::$JOB_PW"
          {
            echo "APP_RW_PASSWORD=$APP_PW"
            echo "MIGRATOR_PASSWORD=$MIG_PW"
            echo "APP_JOB_PASSWORD=$JOB_PW"
            echo "JOB_DATABASE_URL=postgres://app_job:$JOB_PW@db.localtest.me:5432/main"
            echo "ADMIN_DATABASE_URL=postgres://postgres:postgres@db.localtest.me:5432/main"
            echo "DATABASE_URL=postgres://app_rw:$APP_PW@db.localtest.me:5432/main"
            echo "MIGRATION_DATABASE_URL=postgres://migrator:$MIG_PW@db.localtest.me:5432/main"
            echo "CRON_SECRET=$(openssl rand -hex 16)"
            echo "JOB_HMAC_SECRET=$(openssl rand -hex 16)"
            echo "PROVIDER_KEY_MASTER_KEY=$(openssl rand -base64 32)"
            echo "CLERK_SECRET_KEY=sk_test_ci_placeholder"
            echo "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_ci_placeholder"
          } >> "$GITHUB_ENV"

      - name: Wait for the database through the proxy
        run: node scripts/wait-for-db.mjs

      - name: Create roles
        run: npm run db:setup-roles

      - name: Apply migrations as migrator (file order, one transaction per file)
        run: |
          for f in db/migrations/*.sql; do
            echo "applying $f"
            PGUSER=migrator PGPASSWORD="$MIGRATOR_PASSWORD" psql -v ON_ERROR_STOP=1 --single-transaction -q -f "$f"
          done

      - name: Seed model prices
        run: npm run db:seed

      - name: Database tests (IDOR, RLS, repo)
        run: npm run test:db

      - name: Proxy and Postgres logs (on failure)
        if: failure()
        run: docker compose -f ci/docker-compose.db.yml logs --no-color --tail=200

      - name: Stop containers
        if: always()
        run: docker compose -f ci/docker-compose.db.yml down -v

  # Python SDK against the REAL openai and anthropic packages (dev-only exact pins in sdk/python/ci/requirements-providers*.txt),
  # talking to a local fake HTTP server: no API keys, no secrets, no network beyond pip. The matrix is every Python the package
  # claims (pyproject classifiers; tests/test_ci_config.py keeps both lists equal). Python 3.9 gets the older provider releases
  # because the newest majors require 3.10+; one extra entry runs those older releases on a current Python too.
  sdk-python:
    name: sdk-python (py${{ matrix.python }}, ${{ matrix.pins }} pins)
    # PINNED on purpose, only for this job: `ubuntu-latest` has moved to Ubuntu 26.04, which has no Python 3.9 build in
    # actions/python-versions (3.9 is end-of-life; 3.9 exists for 22.04 and 24.04 only, 3.10 to 3.15 exist for all three).
    # 3.9 is our supported minimum (pyproject requires-python). Remove this pin when 3.9 is dropped. ubuntu-24.04 stays
    # available until GitHub deprecates it, which starts when the NEXT Ubuntu image (28.04) goes GA (runner-images policy:
    # at most 2 GA images).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        pins: [current]
        include:
          - python: "3.12"
            pins: legacy
    defaults:
      run:
        working-directory: sdk/python
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      LLM_MONITOR_PIN_SET: ${{ matrix.pins }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            sdk/python/pyproject.toml
            sdk/python/ci/requirements-providers.txt
            sdk/python/ci/requirements-providers-legacy.txt

      - name: Check the interpreter and the pins (fails clearly if this Python is unsupported)
        run: python ci/check_environment.py

      - name: Install the SDK (it has no dependencies)
        run: python -m pip install -e ".[dev]"

      # The SDK must work with no provider package installed: the provider tests skip themselves here.
      - name: SDK tests without any provider package
        run: python -X dev -W error::ResourceWarning -m pytest -q

      - name: Install the real provider packages (pinned, dev-only)
        run: python -m pip install -r "ci/requirements-providers${{ matrix.pins == 'legacy' && '-legacy' || '' }}.txt"

      - name: Installed provider versions are exactly the pinned ones
        run: python ci/check_environment.py --require-providers

      # A missing or wrong-version package FAILS here instead of skipping (LLM_MONITOR_REQUIRE_REAL_SDKS=1).
      - name: SDK tests against the real openai and anthropic packages
        env:
          LLM_MONITOR_REQUIRE_REAL_SDKS: "1"
        run: python -X dev -W error::ResourceWarning -m pytest -q -ra
